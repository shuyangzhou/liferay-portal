delayed-keep-instances=Keep Component Instances
delayed-keep-instances-help=Whether or not to keep instances of delayed components once they are not referred to any more. The Declarative Services specifications suggests that instances of delayed components are disposed off if there is not used any longer. Setting this flag causes the components to not be disposed off and thus prevent them from being constantly recreated if often used. Examples of such components may be EventHandler services. The default is to dispose of unused components.
factory-enabled=Extended Factory Components
factory-enabled-help=Whether or not to enable the support for creating Factory Component instances based on factory configuration. This is an Apache Felix SCR specific extension, explicitly not supported by the Declarative Services specification. Reliance on this feature prevent the component from being used with other Declarative Services implementations. The default value is false to disable this feature.
global-extender=Global Extender
global-extender-help=Whether to extend all bundles whether or not visible to this bundle.
lock-timeout-milliseconds=Lock timeout milliseconds
lock-timeout-milliseconds-help=How long a lock is held before releasing due to suspected deadlock
log-level=SCR Log Level
log-level-help=Allows limiting the amount of logging information sent to the OSGi LogService. Supported values are DEBUG, INFO, WARN, and ERROR. This property is not used if a R7 LogService implementation is available as the log level can be configured through that service. Default is ERROR.
org-apache-felix-scr-scrservice-ocd-help=Configuration for the Apache Felix Declarative Services Implementation. This configuration overwrites configuration defined in framework properties of the same names.
org-apache-felix-scr-scrservice-ocd-name=Apache Felix Declarative Service Implementation
stop-timeout-milliseconds=Stop timeout milliseconds
stop-timeout-milliseconds-help=How long stopping a bundle is waited for before continuing due to suspected deadlock