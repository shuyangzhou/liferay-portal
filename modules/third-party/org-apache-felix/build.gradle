import com.liferay.gradle.plugins.patcher.PatchTask
import com.liferay.gradle.util.FileUtil

apply plugin: "com.liferay.patcher"

String felixOsgiVersion = "3.5.1-20150612.021433-1"

dependencies {
	compile group: "org.apache.felix", name: "org.apache.felix.fileinstall", optional, version: "3.5.1-SNAPSHOT"
	compile group: "org.apache.felix", name: "org.osgi.core", optional, version: "1.0.0"
}

liferay {
	deployDir = file("${liferayHome}/osgi/static")
}

sourceCompatibility = "1.6"
targetCompatibility = "1.6"

task patch(type: PatchTask)

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/felix/fileinstall/internal/Scanner.java"
	fileNames "org/apache/felix/fileinstall/internal/WatcherScanner.java"

	originalLibModuleName = "org.apache.felix.fileinstall"

	originalLibSrcFile = {
		FileUtil.get(project, "https://repository.liferay.com/nexus/content/groups/public/org/apache/felix/org.apache.felix.fileinstall/3.5.1-SNAPSHOT/org.apache.felix.fileinstall-${felixOsgiVersion}-sources.jar")
	}
}