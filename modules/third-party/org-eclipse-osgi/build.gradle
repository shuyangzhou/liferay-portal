import com.liferay.gradle.plugins.patcher.PatchTask
import com.liferay.gradle.util.FileUtil

import org.gradle.internal.hash.HashUtil
import org.gradle.internal.hash.HashValue

liferay {
	deployDir = file("${liferayHome}/osgi/core")
}

apply plugin: "com.liferay.patcher"

task checkJar
task patch(type: PatchTask)

sourceCompatibility = "1.6"
targetCompatibility = "1.6"

String eclipseOsgiSnapshotVersion = "3.10.200-20150904.172142-1"
String eclipseOsgiVersion = "3.10.200-SNAPSHOT"

checkJar {
	doLast {
		File deployedLibFile = new File(liferay.deployDir, patch.originalLibModuleName + ".jar")

		if (!deployedLibFile.exists()) {
			logger.warn "Unable to find " + deployedLibFile

			return
		}

		File originalLibFile = patch.originalLibFile

		HashValue deployedLibHashValue = HashUtil.sha1(deployedLibFile)
		HashValue originalLibHashValue = HashUtil.sha1(originalLibFile)

		if (deployedLibHashValue != originalLibHashValue) {
			throw new GradleException("Hash values of ${deployedLibFile} and ${originalLibFile} do not match")
		}
	}
}

copyPatchOriginalLibClasses {
	exclude "META-INF/*.SF"
	exclude "META-INF/*.RSA"
}

dependencies {
	compile group: "org.eclipse.osgi", name: "org.eclipse.osgi", version: eclipseOsgiSnapshotVersion
}

deploy {
	dependsOn checkJar
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/eclipse/osgi/framework/eventmgr/EventManager.java"
	fileNames "org/eclipse/osgi/framework/eventmgr/ListenerQueue.java"
	fileNames "org/eclipse/osgi/internal/serviceregistry/FilteredServiceListener.java"
	fileNames "org/osgi/util/tracker/AbstractTracked.java"

	originalLibModuleName = "org.eclipse.osgi"

	originalLibSrcFile = {
		FileUtil.get(project, "http://repository.liferay.com/nexus/content/groups/public/org/eclipse/osgi/org.eclipse.osgi/${eclipseOsgiVersion}/org.eclipse.osgi-${eclipseOsgiSnapshotVersion}-sources.jar")
	}
}