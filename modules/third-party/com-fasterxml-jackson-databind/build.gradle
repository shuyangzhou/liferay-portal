task jarPatched(type: Copy)

dependencies {
	compileOnly group: "com.fasterxml.jackson.core", name: "jackson-databind", transitive: false, version: "2.12.2"
}

jar {
	setActions([])

	dependsOn jarPatched
}

jarPatched {
	doLast {
		ant.jar(basedir: temporaryDir, destfile: jar.archivePath, manifest: new File(temporaryDir, "META-INF/MANIFEST.MF"))
	}

	duplicatesStrategy = "exclude"

	exclude "module-info.class"

	from sourceSets.main.output

	from {
		zipTree(configurations.compileOnly.singleFile)
	}

	into temporaryDir
}