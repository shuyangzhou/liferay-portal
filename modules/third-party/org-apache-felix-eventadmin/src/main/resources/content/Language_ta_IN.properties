async-to-sync-threadRatio=Async/sync Thread Pool Ratio (Automatic Copy)
async-to-sync-threadRatio-help=The ratio of asynchronous to synchronous threads in the internal thread pool. Ratio must be positive and may be adjusted to represent the distribution of post to send operations. Applications with higher number of post operations should have a higher ratio. (Automatic Copy)
ignore-timeout=Ignore Timeouts (Automatic Copy)
ignore-timeout-help=Configure event handlers to be called without a timeout. If a timeout is configured by default all event handlers are called using the timeout. For performance optimization it is possible to configure event handlers where the timeout handling is not used - this reduces the thread usage from the thread pools as the timout handling requires an additional thread to call the event handler. However, the application should work without this configuration property. It is a pure optimization! The value is a list of strings. If a string ends with a dot, all handlers in exactly this package are ignored. If the string ends with a star, all handlers in this package and all subpackages are ignored. If the string neither ends with a dot nor with a star, this is assumed to define an exact class name. (Automatic Copy)
ignore-topic=Ignore Topics (Automatic Copy)
ignore-topic-help=For performance optimization it is possible to configure topics which are ignored by the event admin implementation. In this case, a event is not delivered to registered event handlers. The value is a list of strings (separated by comma). If a single value ends with a dot, all topics in exactly this package are ignored. If a single value ends with a star, all topics in this package and all sub packages are ignored. If a single value neither ends with a dot nor with a start, this is assumed to define an exact topic. A single star can be used to disable delivery completely. (Automatic Copy)
org-apache-felix-eventadmin-ocd-help=Configuration for the Apache Felix Event Admin Implementation. This configuration overwrites configuration defined in framework properties of the same names. (Automatic Copy)
org-apache-felix-eventadmin-ocd-name=Apache Felix Event Admin Implementation (Automatic Copy)
require-topic=Require Topic (Automatic Copy)
require-topic-help=Are event handlers required to be registered with a topic? This is enabled by default. The specification says that event handlers must register with a list of topics they are interested in. Disabling this setting will enable that handlers without a topic are receiving all events (i.e., they are treated the same as with a topic=*). (Automatic Copy)
thread-pool-size=Thread Pool Size (Automatic Copy)
thread-pool-size-help=The size of the thread pool used for event delivery. The default value is 20. Increase in case of a large amount of events. A value of less then 2 triggers the default value. If the pool is exhausted, event delivery is blocked until a thread becomes available from the pool. Each event is delivered in a thread from the pool unless the ignore timeouts is configured for the receiving event handler. (Automatic Copy)
timeout=Timeout (Automatic Copy)
timeout-help=The black-listing timeout in milliseconds. The default value is 5000. Increase or decrease at own discretion. A value of less then 100 turns timeouts off. Any other value is the time in milliseconds granted to each event handler before it gets blacklisted (Automatic Copy)