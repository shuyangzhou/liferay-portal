buildscript {
	dependencies {
		classpath group: "com.liferay", name: "com.liferay.css.builder", version: "@com.liferay.css.builder.version@"
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.css.builder", version: "@com.liferay.gradle.plugins.css.builder.version@"
	}

	repositories {
		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "com.liferay.css.builder"
#if (${projectType} != "workspace")
apply plugin: "war"
#end

dependencies {
#if (${dependencyManagementEnabled} == "true")
	compile group: "com.liferay", name: "com.liferay.bean.portlet.api"
	compile group: "com.liferay", name: "com.liferay.bean.portlet.cdi.extension"
	compile group: "org.jboss.weld.servlet", name: "weld-servlet"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib"
	compileOnly group: "javax.portlet", name: "portlet-api"
	compileOnly group: "javax.servlet", name: "javax.servlet-api"
	compileOnly group: "jstl", name: "jstl"
#else
	compile group: "com.liferay", name: "com.liferay.bean.portlet.api", version: "1.0.0"
	compile group: "com.liferay", name: "com.liferay.bean.portlet.cdi.extension", version: "1.0.0"
	compile group: "org.jboss.weld.servlet", name: "weld-servlet", version: "2.3.3.Final"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "3.13.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "3.1.0"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.0"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
	compileOnly group: "jstl", name: "jstl", version: "1.2"
#end
}

war {
	dependsOn buildCSS
	exclude "**/*.scss"

	filesMatching("**/.sass-cache/") {
		it.path = it.path.replace(".sass-cache/", "")
	}

	includeEmptyDirs = false
}
#if (${projectType} != "workspace")

repositories {
	maven {
		url "https://repository-cdn.liferay.com/nexus/content/groups/public"
	}
}#end